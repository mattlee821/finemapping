name: container

on:
  push:
    branches: [main, gwasfinemapping]
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/container.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "DESCRIPTION"
      - "NAMESPACE"
      - "R/**"
      - "conf/**"
      - "nextflow.config"
      - "finemapping.nf"
      - "environment.yml"
      - "man/**"
      - "renv.lock"
      - "renv/**"
      - "scripts/**"
      - "tests/**"
      - "benchmark/**"
      - "requirements-tools.txt"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate_and_publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build local amd64 image for test & benchmark gate
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: gwasfinemapping:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run test suite and benchmark inside container
        run: |
          docker run --rm gwasfinemapping:ci bash -lc "bash scripts/test.sh && bash scripts/benchmark.sh"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mattlee821/finemapping
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - name: Publish multi-arch GHCR image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
